[project]
name = "o-mos"
version = "0.1.0"
description = "A local LLM learning project backed by Ollama and Qwen3"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langchain-ollama>=1.0.0",
  "langgraph>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
o-mos = "o_mos.cli:main"
o-mos-api = "o_mos.api:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["o_mos"]
